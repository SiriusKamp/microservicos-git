<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro Cliente-Produto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h1 class="mb-4">Vincular Cliente e Produto</h1>
      <form id="form-cadastro" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="codigo_cliente" class="form-label"
            >Código do Cliente</label
          >
          <input
            type="number"
            class="form-control"
            id="codigo_cliente"
            name="codigo_cliente"
            required
          />
          <div class="invalid-feedback">Informe o código do cliente.</div>
        </div>

        <div class="mb-3">
          <label for="codigo_produto" class="form-label"
            >Código do Produto</label
          >
          <input
            type="number"
            class="form-control"
            id="codigo_produto"
            name="codigo_produto"
            required
          />
          <div class="invalid-feedback">Informe o código do produto.</div>
        </div>

        <div class="mb-3">
          <label for="data_ativacao" class="form-label">Data de Ativação</label>
          <input
            type="date"
            class="form-control"
            id="data_ativacao"
            name="data_ativacao"
            required
          />
          <div class="invalid-feedback">Informe a data de ativação.</div>
        </div>

        <div class="mb-3">
          <label for="data_inativacao" class="form-label"
            >Data de Inativação</label
          >
          <input
            type="date"
            class="form-control"
            id="data_inativacao"
            name="data_inativacao"
            required
          />
          <div class="invalid-feedback">Informe a data de inativação.</div>
        </div>

        <div class="mb-3">
          <label for="valor_produto" class="form-label">Valor do Produto</label>
          <input
            type="number"
            class="form-control"
            id="valor_produto"
            name="valor_produto"
            required
          />
          <div class="invalid-feedback">Informe o valor do produto.</div>
        </div>

        <div class="mb-3">
          <label for="desconto" class="form-label">Desconto</label>
          <input
            type="number"
            class="form-control"
            id="desconto"
            name="desconto"
            value="0.00"
          />
        </div>

        <button type="submit" class="btn btn-primary">Vincular</button>
      </form>
    </div>

    <script>
      document
        .getElementById("form-cadastro")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const formData = new FormData(event.target);
          const clienteProduto = {
            cliente: { id: formData.get("codigo_cliente") },
            produto: { id: formData.get("codigo_produto") },
            dataAtivacao: formData.get("data_ativacao"),
            dataInativacao: formData.get("data_inativacao"),
            valorProduto: parseFloat(formData.get("valor_produto")),
            desconto: parseFloat(formData.get("desconto")),
            ativo: 1,
          };

          fetch("http://localhost:8080/cliente-produto", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(clienteProduto),
          })
            .then((response) => response.json())
            .then(() => alert("Cliente e Produto vinculados com sucesso!"))
            .catch(() => alert("Erro ao vincular cliente e produto."));
        });
    </script>
  </body>
</html>
